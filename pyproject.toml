[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wechatauto-bot"
version = "1.0.0"
description = "微信 4.x AI 自动回复机器人（GUI）：本地数据库读消息 + 大模型 + UIA 发送，支持群昵称 @、三层记忆、人物规则"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "wechatauto-bot contributors" }]
keywords = [
    "wechat", "weixin", "wechat4", "wxauto", "wechatauto",
    "chatbot", "llm", "automation", "uiautomation", "sqlcipher", "rpa",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Natural Language :: Chinese (Simplified)",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "wechatauto-replica>=1.2.1",
    "winsdk>=1.0.0b10",
    "pypinyin>=0.48.0",
]

[project.optional-dependencies]
# 装了就用官方 SDK 调大模型，不装则走内置的标准库 urllib 实现
openai = ["openai>=1.0.0"]

[project.urls]
Homepage = "https://github.com/fanyuantaier/wechatauto-replica"
# 上游依赖（微信 4.x 读取/发送能力的来源）
"Upstream dependency" = "https://github.com/fanyuantaier/wechatauto-replica"

[tool.setuptools]
# 单文件程序 + 工具脚本，不做成包
py-modules = ["wx_ai_bot"]
